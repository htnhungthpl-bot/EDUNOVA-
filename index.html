    <script>
      // Fix for environments/extensions attempting to override window.fetch when it has only a getter
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = function() {
            return (_rawFetch || fetch).apply(this, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Could not configure window.fetch setter:', e);
        }
      })();
    </script>
